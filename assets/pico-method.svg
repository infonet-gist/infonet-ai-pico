<path class="arrow" d="M865 374 H909 V299 H946"/>
<text x="548" y="318" class="note">u</text>
<text x="912" y="184" class="note">g̃</text>
<text x="914" y="369" class="note">ξ</text>
<rect x="42" y="461" width="1150" height="28" rx="5" fill="#F5F7F9"/>
<text x="58" y="480" class="note">SpecFlag and group pause suppress perturbation when unstable; they do not freeze the utility-protected gradient update.</text>
</svg>